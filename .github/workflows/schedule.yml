name: QuizTheCodeBot Automation

on:
  schedule:
    # GitHub Actions cron schedules use UTC time.
    # Convert your local times to UTC. (Currently set for Indian Standard Time IST, UTC+5:30):
    # - 09:00 AM IST = 03:30 AM UTC
    # - 01:00 PM IST = 07:30 AM UTC
    # - 08:00 PM IST = 02:30 PM UTC
    - cron: '30 3 * * *'
    - cron: '30 7 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch: # Allows you to manually trigger the run from the GitHub Actions tab anytime!

# Give the runner permission to commit and push changes back to the repository
permissions:
  contents: write

jobs:
  post-reel:
    name: Generate & Post Reel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Auto-Post
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python main.py post

      - name: Commit & Save Used Questions State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add used_questions.json
          # Check if used_questions.json actually changed before committing
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update used questions state [skip ci]" && git push)

      - name: Send Discord Notification on Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"🟢 **QuizTheCodeBot Success!**\nYour coding reel has been successfully generated and published directly to Instagram! 🚀\n*(Published at $(date +'%Y-%m-%d %H:%M:%S') UTC)*\"}" \
               ${{ secrets.DISCORD_WEBHOOK }}

      - name: Send Discord Notification on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"🔴 **QuizTheCodeBot Failed!**\nThe auto-posting pipeline failed during execution. Please check your GitHub Actions logs for details:\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
               ${{ secrets.DISCORD_WEBHOOK }}


